[project]
name = "tech-arauz-ai"
version = "0.1.0"
description = "Serviço de AI para Tech Arauz - Gestão de Agentes com LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Gabriel Cristofolini", email = "gabriel@solucoes.tech" },
]

dependencies = [
    # FastAPI + Server
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    
    # LangChain + LangGraph
    "langchain>=0.1.7",
    "langchain-core>=0.1.20",
    "langchain-community>=0.0.20",
    "langgraph>=0.0.30",
    
    # LangSmith (Observability)
    "langsmith>=0.0.87",
    
    # HTTP Client (para chamar Next.js)
    "httpx>=0.27.0",
    
    # Database
    "asyncpg>=0.29.0",
    "supabase>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "httpx>=0.27.0",  # Para testes
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
