name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Lint
      run: npm run lint

    - name: Run Typecheck
      run: npm run typecheck

    - name: Check Formatting
      run: npm run format:check

    - name: Run Tests
      run: npm run test

    - name: Run Tests with Coverage
      run: npm run test -- --coverage --reporter=json --outputFile=coverage/coverage-summary.json
      continue-on-error: false

    - name: Audit NEXT_PUBLIC secrets exposure
      run: npm run audit:secrets

    - name: Validate required secrets for RLS audit
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
      run: |
        if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
          echo "Missing required secret: SUPABASE_URL"
          exit 1
        fi
        if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
          echo "Missing required secret: SUPABASE_SERVICE_ROLE_KEY"
          exit 1
        fi

    - name: Run RLS audit gate
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: npm run audit:rls

    - name: Build Project
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      run: npm run build
